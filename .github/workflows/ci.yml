name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# A newer push to the same ref supersedes an in-flight run (saves Actions minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore Formbase.slnx

      - name: Build
        run: dotnet build Formbase.slnx --no-restore --configuration Release

      # Live tests are excluded from compilation unless their opt-in flag is set, so the default
      # suite needs no Docker host or service containers. The Postgres suite runs in its own job.
      - name: Test
        run: dotnet test --solution Formbase.slnx --no-build --configuration Release --verbosity normal

  postgres-live:
    name: Postgres Live Contract
    runs-on: ubuntu-latest
    # Gated on the cheap suite: a compile error or a plain-suite regression should not also burn
    # container-pulling minutes here. The live flag changes which files compile, so this job cannot
    # reuse the build job's output and rebuilds regardless.
    needs: build
    # The runner already provides a Docker daemon, and the fixture starts its own postgres through
    # Testcontainers — so this needs no `services:` block, only the opt-in flag.
    # Bounds the job independently of the fixture's own readiness timeout: a wedged daemon or a slow
    # image pull costs a few minutes of Actions time, not the six-hour default.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # The flag changes which files compile, so restore/build/test all carry it.
      - name: Test (Postgres live contract)
        run: dotnet test --solution Formbase.slnx --configuration Release --verbosity normal -p:IncludePostgresLiveTests=true

  morphdb-live:
    name: MorphDB Live Contract
    runs-on: ubuntu-latest
    # Same gating as postgres-live: don't burn container minutes on a build that already failed.
    needs: build
    # The fixture starts morphdb and its postgres through Testcontainers and provisions its own
    # project, so no `services:` block and no seeded state are needed -- only the opt-in flag.
    # Two containers and an image pull make this the slowest job, hence the wider bound.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # This is the job that catches a MorphDB.Client release drifting from the server: the client
      # comes from nuget.org and the server from ghcr, so nothing here pins them to each other.
      - name: Test (MorphDB live contract)
        run: dotnet test --solution Formbase.slnx --configuration Release --verbosity normal -p:IncludeMorphDbLiveTests=true

  durable-live:
    name: Durable Live Contract
    runs-on: ubuntu-latest
    # Same gating as the other live jobs: don't burn container minutes on a build that already failed.
    needs: build
    # The durable suite is the only one that needs BOTH gates open, because it needs both services at
    # once -- formbase's own state in Postgres and the projected table in MorphDB. Neither of the
    # other live jobs opens both, so until this job existed these tests compiled nowhere in CI and
    # ran only on a developer's machine.
    #
    # It stands up three containers (its own Postgres, plus MorphDB and that one's Postgres), so it
    # gets the widest bound.
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Filtered to the durable namespace on purpose. Opening both gates compiles every live suite,
      # and running them all here would repeat what the two jobs above already cover -- twice the
      # container minutes for no extra signal.
      #
      # The filter names the namespace exactly, and the run is scoped to the one project that holds
      # it: the test platform fails a module in which zero tests ran (exit code 8), so a renamed
      # namespace turns this job red instead of leaving it green and covering nothing -- and the
      # host-test project, which never matches, must not be in the run. If you move these tests,
      # move this line with them.
      - name: Test (durable live contract)
        run: dotnet test --project tests/Formbase.Core.Tests/Formbase.Core.Tests.csproj --configuration Release --verbosity normal -p:IncludeLiveTests=true --filter-namespace Formbase.Core.Tests.Live.Durable

  compose-durability:
    name: Compose Durability
    runs-on: ubuntu-latest
    # Same gating as the other live jobs: this stands up the deployable shape, not the code, so a
    # build that already failed should not also spend the minutes docker-compose needs to pull and
    # build three images.
    needs: build
    # Pulls the published MorphDB and Postgres images and builds the Formbase one — the widest
    # single-run bound in this file after durable-live, for the same reason: three containers.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Stands docker-compose.yml up, writes a document, restarts the host, and reads the document
      # back — the check a green test suite cannot make, because the suite runs in-process and never
      # loses what a restart would. The script needs nothing beyond what the runner already has: a
      # Docker daemon and the images docker-compose.yml names.
      - name: Compose durability check
        run: scripts/compose-durability-check.sh

  quality:
    name: Format & Vulnerability Scan
    runs-on: ubuntu-latest
    env:
      IncludeLiveTests: 'true'
      IncludeLlmLiveTests: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Catches the class of failure the Compose Durability job hit (a tracked script committed
      # without +x fails at "Permission denied", exit 126, only when a workflow tries to run it
      # directly) before it reaches that point -- checks git's tracked mode, not the filesystem
      # bit, since a checkout on a filesystem without POSIX permissions (e.g. this repo's own dev
      # workstations) would otherwise report every script as non-executable regardless of what's
      # actually committed.
      - name: Verify tracked shell scripts are executable
        run: |
          non_exec=$(git ls-files -s -- '*.sh' | awk '$1 != "100755" {print $4}')
          if [ -n "$non_exec" ]; then
            echo "::error::tracked without the executable bit (git mode != 100755):"
            echo "$non_exec"
            exit 1
          fi

      # Published text must not name something only an insider can look up. Needs no dotnet, so
      # it runs before the SDK is set up and fails the job in seconds when it fails.
      - name: Internal token scan
        uses: iyulab/dotnet-ci-actions/internal-token-scan@7e501c0d46f7c06e73a8945f4b0f83fcb347eb53 # main, 2026-09-06
        with:
          min-files: '50'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore Formbase.slnx

      # Four live-test directories are removed from the default compilation (1,785 lines across 20
      # files). The three live jobs compile and run three of them; nothing compiles Live/Llm at all,
      # and a semantic error there passes both `dotnet build` (file excluded) and `dotnet format`
      # (which reports formatting, not semantic errors). Compiling the whole live configuration
      # here closes that, and the same flags open the formatting gate over all four directories.
      # `dotnet format` takes no -p:, but MSBuild reads environment variables as properties, which
      # is why these are job-level `env`. IncludeLiveTests opens Postgres, MorphDB and, through
      # them, Durable.
      - name: Compile the live-only test configuration
        run: dotnet build Formbase.slnx --no-restore --configuration Release

      - name: Check formatting
        run: dotnet format Formbase.slnx --verify-no-changes --verbosity diagnostic

      - name: Check for vulnerable packages
        uses: iyulab/dotnet-ci-actions/vulnerability-scan@00faf7ff62b88e11fbf88edfedcf73bdc5f2eebe # main, 2026-08-31
        with:
          project: Formbase.slnx
